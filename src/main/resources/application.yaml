harmoni:
  user:
    db: pos-user
    password: "forlearn27!"
  ai:
    enabled: true
    rag:
      enabled: false
    system-prompt: |
      You are Harmoni AI, a friendly restaurant ordering assistant.

      Help customers find menu items, check prices, manage their cart, and confirm orders.

      CORE RULES:

      1. NEVER INVENT DATA
      Menu Service is the source of truth.
      Never invent:
      - product names
      - product IDs
      - category IDs
      - prices
      - availability
      - cart contents
      - order status

      Use tools whenever POS data is required.

      2. MENU
      - "lihat menu" / "menu" → getCategoriesByBrand
      - Search category → searchCategoriesByName
      - Products in category → getProductsByCategory
      - Search product or price → searchProductsByName

      Use the customer's original language when searching.
      Preserve product names exactly as returned by the tool.

      2a. TOOL SELECTION RULES — INTENT, NOT WORDS
      You must select tools based on the user's INTENT, not by matching individual words.

      MENU INTENT:
      If the user wants to see the menu or asks what menu/categories are available,
      ALWAYS call getCategoriesByBrand.

      Examples:
      - "menu"
      - "lihat menu"
      - "liat menu"
      - "lihat menunya"
      - "liat menu nya"
      - "tampilkan menu"
      - "tampilkan menunya"
      - "mau lihat menu"
      - "saya mau lihat menu"
      - "ada menu apa?"
      - "what's on the menu?"
      - "minta menunya dong"

      For these requests:
      → CALL getCategoriesByBrand
      Do NOT call:
      → searchProductsByName
      → searchCategoriesByName
      → getProductsByCategory

      PRODUCT INTENT:
      Only search for a product when the user explicitly asks about a product.

      Examples:
      - "ada caramel macchiato?"
      - "berapa harga caramel macchiato?"
      - "saya mau caramel macchiato"
      - "cari kopi latte"

      For these requests:
      → CALL searchProductsByName

      3. ADD TO CART
      When the customer wants to order a product:
      - Search the product first (searchProductsByName).
      - Get the real productId AND skuId from the tool result.
      - Call addToOrder with BOTH productId and skuId.
      - Default quantity is 1 if not specified.
      - If multiple products or SKUs/variants match, ask the customer to choose.
      - Never invent a productId, skuId, categoryId, or price.
      - The Menu Service is the ONLY source of truth for identifiers and prices.

      4. CART
      Use getCurrentOrder when the customer asks about the current order/cart.

      Use removeOrderItem when the customer wants to remove an item.

      Never assume cart contents.

      5. CONFIRM ORDER
      Only call confirmOrder after explicit customer confirmation.

      Examples:
      - "ya"
      - "iya pesan"
      - "confirm"
      - "checkout"
      - "lanjutkan pesanan"

      Before confirmation, show the cart summary and total when available.
      ALWAYS ask the customer for the payment method first — Tunai/Cash, QRIS, or Kartu/Debit —
      then call confirmOrder with the chosen method.
      If the customer mentioned any special request or note (e.g. 'es extra', 'tanpa gula', 'pesan dibungkus'),
      pass it to confirmOrder's note parameter.
      The order is created then immediately marked paid by the tool.
      After a successful order the cart is cleared, so never keep quoting the old cart.

      6. TOOL RESULTS ARE TRUTH
      If a tool succeeds, report the actual result.
      If a tool fails, tell the customer briefly.
      Never claim an operation succeeded when the tool failed.

      7. LANGUAGE
      Reply in the same language as the customer.
      Use Indonesian Rupiah format such as Rp18.000.

      8. STYLE
      Be concise, friendly, and conversational.
      Do not expose internal APIs, stack traces, IDs unless needed for the customer.
      Do not explain internal tool usage.

      IMPORTANT:
      The LLM handles conversation.
      Tools handle POS data.
      Never guess POS data.
      Never create an order without explicit confirmation.
  services:
    menu:
      base-url: http://127.0.0.1:8082
      timeout-ms: 3000
      endpoints:
        product-search: /api/v1/product/search
        product-by-id: /api/v1/product/{id}
        category-search: /api/v1/category/search
        category-by-brand: /api/v1/category/brand/{brandId}
        product-by-category-price: /api/v1/product/category/{id}/price
        product-by-category-paged: /api/v1/product/category/{categoryId}/{brandId}
    order:
      base-url: http://127.0.0.1:8083
      timeout-ms: 3000
      store-id: 1
      store-service-types-id: 1
      default-username: Kasir1
      endpoints:
        create-order: /api/v1/order

spring:
  application:
    name: customer
  datasource:
    auth:
      mysql:
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://localhost:3306/db-harmoni-customer?rewriteBatchedStatements=true
        username: ${harmoni.user.db}
        password: ${harmoni.user.password}
    type: org.apache.commons.dbcp2.BasicDataSource
    url: jdbc:mysql://localhost:3306/db-harmoni-customer
    username: ${harmoni.user.db}
    password: ${harmoni.user.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  ai:
    # DEFAULT provider: local Ollama — free, unlimited, zero 429s, no API key, no internet needed.
    # qwen2.5:3b = fast (~1s/turn on this Mac's CPU), supports the menu/cart/order tools.
    # Slower-but-smarter alternatives on this CPU-only Mac: qwen3:4b (thinking, ~50s/turn).
    openai:
      base-url: http://localhost:11434/v1
      api-key: ollama
      chat:
        completions-path: /chat/completions
        options:
          model: qwen2.5:3b
          temperature: 0.7
      audio:
        transcription:
          api-key: ollama
        speech:
          api-key: ollama
      image:
        api-key: ollama
      embedding:
        model: nomic-embed-text
    vectorstore:
      simple:
        initialize-schema: true
  http:
    client:
      connect-timeout: 30s
      read-timeout: 180s
  # 429 handling — retry with backoff (used by CustomerAiChatService for both blocking & streaming)
  retry:
    max-attempts: 5
    initial-interval: 3s
    max-interval: 30s
    multiplier: 2.0
    jitter-factor: 0.2

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

server:
  port: 8084
  address: 127.0.0.1

# ---------------------------------------------------------------------------
# Alternative providers — activate with -Dspring-boot.run.profiles=<name>.
# Default (no profile) = local Ollama (free, unlimited, offline, zero 429s).
#   Ollama Cloud: OLLAMA_API_KEY=<key> ./mvnw spring-boot:run -Dspring-boot.run.profiles=ollama-cloud
#   Gemini:       GEMINI_API_KEY=<key> ./mvnw spring-boot:run -Dspring-boot.run.profiles=gemini
#   Groq:         GROQ_API_KEY=gsk_xxx ./mvnw spring-boot:run -Dspring-boot.run.profiles=groq
# ---------------------------------------------------------------------------

---
spring:
  config:
    activate:
      on-profile: groq
  ai:
    openai:
      base-url: https://api.groq.com/openai
      api-key: ${GROQ_API_KEY:}
      chat:
        options:
          model: openai/gpt-oss-20b
harmoni:
  ai:
    rag:
      enabled: false

---
# Official hosted Ollama (https://ollama.com) — same OpenAI-compatible API the local
# default uses, same tool-calling engine (already proven with qwen2.5:3b).
# Free plan = monthly STARTER usage credits (resets monthly, NOT a 20/day cliff)
# + 1 concurrent request. gpt-oss:20b is a "level 1 / light" model, so it stays
# comfortably inside the free monthly credits.
# Key: https://ollama.com/settings/keys  |  Model list: https://ollama.com/v1/models
spring:
  config:
    activate:
      on-profile: ollama-cloud
  ai:
    openai:
      base-url: https://ollama.com/v1
      api-key: ${OLLAMA_API_KEY:}
      chat:
        completions-path: /chat/completions
        options:
          model: gpt-oss:20b
          temperature: 0.7
harmoni:
  ai:
    rag:
      enabled: false

---
# Google Gemini free tier via the OpenAI-compatible endpoint.
# Key: any Gemini API key (AI Studio "AIza..." OR native "AQ..." keys both work here).
# IMPORTANT: "gemini-2.5-flash" is decommissioned for new users -> Google answers 404.
# Use the rolling alias "gemini-flash-latest" instead.
# WARNING: the free tier caps at only ~20 requests/DAY per model — fine for quick
# tests, NOT for a working app. Use the ollama-cloud profile for real usage.
spring:
  config:
    activate:
      on-profile: gemini
  ai:
    openai:
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      api-key: ${GEMINI_API_KEY:}
      chat:
        completions-path: /chat/completions
        options:
          model: gemini-flash-latest
          temperature: 0.1
          top-p: 0.9
harmoni:
  ai:
    rag:
      enabled: false

# Both profiles share the same HTTP port and logging as the default config above.
server:
  port: 8084
  address: 127.0.0.1

logging:
  level:
    org.springframework.ai: DEBUG
    org.springframework.ai.chat.client: DEBUG
    org.springframework.ai.tool: DEBUG
    org.mybatis: DEBUG
    org.apache.ibatis: DEBUG
    com:
      harmoni:
        pos:
          customer: DEBUG